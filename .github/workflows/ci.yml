name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test with coverage
        run: mvn -B -DskipTests=false test jacoco:report

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload JaCoCo coverage (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-html
          path: target/site/jacoco

      - name: Upload JaCoCo XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml

      - name: Generate coverage badge (non-blocking)
        uses: cicirello/jacoco-badge-generator@v3
        continue-on-error: true
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          generate-coverage-badge: true
          fail-if-coverage-less-than: '0'

      - name: Upload coverage badge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: badges/**

      - name: OWASP Dependency-Check (fail on high severity)
        run: mvn -B -DskipTests org.owasp:dependency-check-maven:check -Dformat=HTML -Dformat=JSON -DfailOnCVSS=7

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json

      - name: Start Spring Boot (forked)
        run: mvn -B -DskipTests spring-boot:start

      - name: Wait for app and fetch OpenAPI
        run: |
          set -e
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/swagger-ui/index.html > /dev/null; then
              echo "App is up"
              break
            fi
            echo "Waiting for app... $i"
            sleep 2
          done
          mkdir -p target/openapi
          curl -fsS http://localhost:8080/v3/api-docs -o target/openapi/openapi.json

      - name: Validate OpenAPI schema
        run: |
          npm install -g @apidevtools/swagger-cli
          swagger-cli validate target/openapi/openapi.json

      - name: Stop Spring Boot
        if: always()
        run: mvn -B spring-boot:stop

      - name: Upload OpenAPI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: target/openapi/openapi.json

      - name: Spotless check (non-blocking)
        run: mvn -B -DskipTests spotless:check
        continue-on-error: true

      - name: Start Spring Boot app
        run: mvn -B -DskipTests spring-boot:start

      - name: Wait for app to be ready
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then echo "UP"; exit 0; fi
            sleep 2
          done
          echo "App did not become ready" && exit 1
        shell: bash

      - name: Fetch Swagger UI (sanity)
        run: |
          curl -fsS http://localhost:8080/swagger-ui/index.html | head -n 1

      - name: Export OpenAPI JSON
        run: |
          mkdir -p target/openapi
          curl -fsS http://localhost:8080/v3/api-docs -o target/openapi/openapi.json

      - name: OpenAPI contract drift check (baseline if present)
        run: |
          if [ -f docs/openapi/openapi.json ]; then
            echo "Comparing generated OpenAPI with baseline docs/openapi/openapi.json"
            diff -u docs/openapi/openapi.json target/openapi/openapi.json || (echo "::error::OpenAPI contract drift detected. If changes are intentional, update docs/openapi/openapi.json." && exit 1)
          else
            echo "No baseline found at docs/openapi/openapi.json. Skipping drift check."
          fi

      - name: Stop Spring Boot app
        run: mvn -B spring-boot:stop

      - name: Upload OpenAPI JSON
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: target/openapi/openapi.json

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Upload UI test results (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ui/test-results/**/*.xml

  ui-e2e:
    runs-on: ubuntu-latest
    needs: ui
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build UI
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --port 5173 --strictPort --host &
        shell: bash

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 >/dev/null 2>&1; then echo "UI up"; exit 0; fi
            sleep 2
          done
          echo "UI preview did not start" && exit 1
        shell: bash

      - name: Run Playwright e2e tests
        run: npx playwright test --reporter=line
        continue-on-error: true

      - name: Upload Playwright report (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: ui/playwright-report
