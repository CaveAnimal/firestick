<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout">
  <head>
    <title th:fragment="title">Search - Firestick</title>
  </head>
  <body>
    <div th:fragment="body">
      <h2>Search</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <input id="q" type="text" placeholder="Search..." style="flex:1;padding:8px;border:1px solid var(--color-border);border-radius:4px;" />
        <button class="btn btn-primary" onclick="doSearch(document.getElementById('q').value)">Search</button>
      </div>
      <div id="search-results" style="margin-top:16px"></div>
    </div>
  </body>
</html>
