<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:replace="~{::title}">Firestick</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header style="padding:12px;border-bottom:1px solid var(--color-border);background:var(--color-bg-muted)">
      <div style="display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto;">
        <div style="font-weight:700">Firestick</div>
        <nav style="margin-left: 8px;display:flex;gap:8px;">
          <a href="/">Home</a>
          <a href="/search">Search</a>
          <a href="/indexing">Indexing</a>
          <a href="/logs">Logs</a>
        </nav>
      </div>
    </header>

    <main role="main" style="max-width:1200px;margin:24px auto;">
      <div th:replace="~{::body}"></div>
    </main>

    <footer style="padding:12px;border-top:1px solid var(--color-border);background:var(--color-bg-muted);text-align:center">
      Firestick — server-side UI
    </footer>

    <script src="/js/app.js"></script>
  </body>
</html>
